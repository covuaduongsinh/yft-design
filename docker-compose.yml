# Triển khai yft-design (frontend + backend trong một container).
#
# Dokploy: tạo ứng dụng kiểu "Docker Compose" trỏ tới repo này, nhập biến môi
# trường ở tab Environment (Dokploy ghi chúng vào file .env cạnh file này),
# rồi gắn domain cho service `app`, cổng 8788, ở tab Domains.
#
# Chạy thử không qua Dokploy: sao chép .env.example thành .env, thêm
#   ports: ["8788:8788"]
# vào service `app`, rồi `docker compose up -d --build`.

services:
  app:
    build: .
    image: yft-design:latest
    restart: unless-stopped
    init: true                      # để SIGTERM tới được Node và đóng CSDL gọn gàng
    env_file:
      - path: .env
        required: false
    environment:
      # Traefik của Dokploy là 1 proxy đứng trước; cần đúng số này để giới hạn
      # tần suất và khoá tạm tính theo IP thật của người dùng.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    volumes:
      # Named volume: Dokploy giữ nguyên qua các lần deploy và sao lưu được.
      # KHÔNG đổi thành bind mount tuyệt đối — Dokploy sẽ dọn nó khi deploy lại.
      - yft-data:/data
    expose:
      - "8788"

  # Tách nền ảnh (tuỳ chọn, mặc định KHÔNG chạy). Bật bằng cách đặt trong biến môi trường:
  #   COMPOSE_PROFILES=matting
  #   MATTING_URL=http://rembg:7000
  # Dịch vụ này nặng (image ~1,6 GB, cần khoảng 2 GB RAM) và không có xác thực, nên chỉ nằm
  # trong mạng nội bộ của compose: không gắn domain, không mở cổng ra ngoài.
  rembg:
    image: danielgatis/rembg:latest
    profiles: ["matting"]
    restart: unless-stopped
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    mem_limit: ${REMBG_MEM_LIMIT:-3g}
    volumes:
      # Giữ mô hình đã tải, khỏi tải lại mỗi lần khởi động. Đường dẫn này theo mặc định của
      # rembg và chưa được kiểm chứng với image hiện hành: nếu mô hình vẫn bị tải lại, hãy xem
      # tài liệu của image để sửa lại đường dẫn.
      - rembg-models:/root/.u2net
    expose:
      - "7000"

volumes:
  yft-data:
  rembg-models:
